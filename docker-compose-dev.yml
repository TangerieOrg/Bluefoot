name: bluefootdev

services:
  eugine:
    build: .
    image: bluefootdev-eugine:latest
    pull_policy: never
    restart: unless-stopped
    networks:
      - traefik-proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-proxy"
      - "traefik.http.routers.bluefootdev.rule=Host(`bluefootdev.tangerie.xyz`)"
      - "traefik.http.routers.bluefootdev.entrypoints=websecure"
      - "traefik.http.routers.bluefootdev.priority=1000"
      - "traefik.http.routers.bluefootdev.middlewares=cors-bluefoot@file"
      - "traefik.http.services.bluefootdev.loadbalancer.server.port=3000"

networks:
  traefik-proxy:
    external: true
